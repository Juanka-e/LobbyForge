<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LobbyForge</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f17;
      --surface: #111722;
      --surface-raised: #171e2b;
      --border: #1f2738;
      --text: #e0e2ea;
      --text-muted: #8b93a7;
      --primary: #8fb8ff;
      --danger: #e36049;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    /* Connect screen — centered card */
    #connect {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #connect.hidden { display: none; }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #6a9eff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #070a0f;
      font-size: 1.25rem;
    }
    .logo h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
    .subtitle { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.75rem; line-height: 1.5; }
    label { display: block; font-size: 0.8125rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.5rem; }
    .url-row { display: flex; gap: 0.5rem; }
    input[type="url"] {
      flex: 1;
      padding: 0.625rem 0.875rem;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="url"]:focus { border-color: var(--primary); }
    input[type="url"]::placeholder { color: var(--text-muted); }
    button {
      padding: 0.625rem 1.25rem;
      background: var(--primary);
      color: #070a0f;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: filter 0.15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: var(--danger); font-size: 0.8125rem; margin-top: 0.75rem; min-height: 1.25rem; }
    .hint { color: var(--text-muted); font-size: 0.75rem; margin-top: 1rem; line-height: 1.5; }
    /* Instance webview — full-bleed iframe */
    #instance-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 5;
    }
    #instance-frame.hidden { display: none; }
    /* Floating disconnect pill over the instance */
    #exit-pill {
      position: fixed;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 20;
      padding: 0.375rem 0.75rem;
      background: rgba(17, 23, 34, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      opacity: 0;
      pointer-events: none;
    }
    #exit-pill.visible { opacity: 1; pointer-events: auto; }
    #exit-pill:hover { color: var(--danger); border-color: var(--danger); }
  </style>
</head>
<body>
  <!-- Connect screen -->
  <div id="connect">
    <div class="card">
      <div class="logo">
        <div class="logo-mark">L</div>
        <h1>LobbyForge</h1>
      </div>
      <p class="subtitle">
        Connect to your self-hosted LobbyForge instance to join voice rooms and live activities.
      </p>
      <form id="connect-form">
        <label for="instance-url">Instance URL</label>
        <div class="url-row">
          <input id="instance-url" type="url" placeholder="https://my.lobbyforge.dev" autocomplete="url" autofocus required />
          <button type="submit" id="connect-btn">Connect</button>
        </div>
        <div class="error" id="error-msg"></div>
      </form>
      <p class="hint">
        Don't have an instance yet? LobbyForge is self-hosted — run it on your own
        server with Docker, or ask your community admin for the instance URL.
      </p>
    </div>
  </div>

  <!-- Instance iframe (loaded after connect) -->
  <iframe id="instance-frame" class="hidden" referrerpolicy="no-referrer" allow="microphone; camera; autoplay; display-capture; clipboard-read; clipboard-write"></iframe>
  <button id="exit-pill" title="Disconnect and return to the connect screen">Switch instance</button>

  <script src="shell.js"></script>
</body>
</html>
