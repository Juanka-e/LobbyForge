[package]
name = "lobbyforge-desktop"
version = "0.1.0"
description = "LobbyForge native desktop shell (connect-to-server)"
authors = ["LobbyForge"]
edition = "2021"
rust-version = "1.77"

# The library name must match the `main.rs` -> `lib.rs` setup Tauri 2 expects.
[lib]
name = "lobbyforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
