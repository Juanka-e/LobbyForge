name: ci

on:
  push:
    branches: [main]
    # 20th-audit: tag pushes run the same gate so the release workflow's
    # verify job has real check runs to gate on (check runs are per-SHA;
    # without this a tag pointing at an unmerged commit would wait forever).
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# security-review §7.1: least privilege. Every job here only reads the
# repo (checkout, install, build, test, docker build/run); none calls the
# GitHub API with write intent. Actions are pinned to full commit SHAs
# (tag in the trailing comment) — Dependabot's github-actions ecosystem
# bumps both together.
permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm MUST be installed before setup-node's cache: pnpm lookup.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build packages first — workspace typecheck depends on built dist/
      # type declarations (e.g. @lobbyforge/plugin-sdk for plugins/quiz).
      - name: Build packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Test
        run: pnpm test

      - name: Build server
        run: pnpm build:server

  # Docker image build — verifies the Dockerfile compiles and the image starts.
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # security-review INFRA-002: install.sh renders the configs (TURN
      # secret included) into the working tree and then builds from it.
      # Render them here too so the build context matches a real install
      # and the check below proves .dockerignore keeps them out.
      - name: Render production configs into the build context
        run: bash scripts/render-configs.sh ci.example.com "$(printf 'b%.0s' $(seq 1 64))" infra infra

      - name: Build Docker image
        run: docker build -t lobbyforge-web:ci .

      # beta-review: the image built WITHOUT build-args is what the release
      # workflow publishes. It must not carry a baked-in localhost media
      # URL (that broke voice + realtime after `lfctl update apply`), and
      # no private key / cert / backup may ever be copied into /app.
      # Checks the browser bundles and the lobby server-rendered livekitUrl
      # prop. Server-side LIVEKIT_URL fallbacks for the RoomService API are
      # fine (install.sh always sets LIVEKIT_URL). No single quotes inside
      # the sh -c script below.
      - name: Image carries no baked endpoints or secrets
        run: |
          docker run --rm --entrypoint sh lobbyforge-web:ci -c '
            set -e
            if grep -rlE "localhost:(7880|3001)" /app/apps/web/.next/static 2>/dev/null | head -5 | grep . \
              || grep -rhoE "livekitUrl:\"[^\"]*localhost[^\"]*\"" /app/apps/web/.next/server | head -3 | grep .; then
              echo "::error::build-time localhost media URL baked into the image"; exit 1
            fi
            found=$(find /app -name node_modules -prune -o \( -name "*.pem" -o -name "*.key" -o -name "*.dump" \) -print | grep -v "^/app/infra/update/release-public.pem$" || true)
            if [ -n "$found" ]; then echo "::error::secret-like files in image:"; echo "$found"; exit 1; fi
            rendered=$(grep -rlE "static-auth-secret=b{64}" /app/infra 2>/dev/null || true)
            if [ -n "$rendered" ]; then echo "::error::rendered TURN config in image:"; echo "$rendered"; exit 1; fi
            for f in /app/infra/turn/turnserver.conf /app/infra/livekit/livekit.yaml /app/infra/nginx/conf.d/app.conf; do
              if [ -e "$f" ]; then echo "::error::rendered config in image: $f"; exit 1; fi
            done
            echo "image clean"
          '

  # Production compose config gate (OPS-006 class regressions): parses
  # docker-compose.prod.yml with dummy-but-complete env and fails on
  # duplicate keys, invalid interpolation or unresolvable mounts —
  # catches in one second what only surfaced at deploy time before.
  compose-config:
    name: Production compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate docker-compose.prod.yml
        run: |
          # env_file targets expect ../../.env.prod at the repo root; the
          # install script creates the real one, CI only needs it to exist
          # with the required interpolation vars resolvable.
          cat > .env.prod <<'EOF'
          DATABASE_URL=postgres://ci:ci@postgres:5432/ci
          REDIS_URL=redis://:ci@redis:6379
          LOBBYFORGE_SESSION_SECRET=ci-secret-ci-secret-ci-secret
          LIVEKIT_API_KEY=cikey
          LIVEKIT_API_SECRET=cisecretcisecretcisecret
          NEXT_PUBLIC_LIVEKIT_URL=wss://ci.example.com:7880
          NEXT_PUBLIC_WS_URL=wss://ci.example.com/ws
          TURN_AUTH_SECRET=cisecret
          EOF
          export POSTGRES_PASSWORD=ci POSTGRES_USER=ci POSTGRES_DB=ci
          export REDIS_PASSWORD=ci LIVEKIT_API_KEY=cikey
          export LIVEKIT_API_SECRET=cisecretcisecretcisecret
          export TURN_AUTH_SECRET=cisecret ACME_EMAIL=ci@example.com
          export LOBBYFORGE_PLUGIN_WORKER_TOKEN=ciworker LOBBYFORGE_PLUGIN_STORAGE_TOKEN=cistorage
          export LOBBYFORGE_DOMAIN=ci.example.com
          export NEXT_PUBLIC_LIVEKIT_URL=wss://ci.example.com:7880
          export NEXT_PUBLIC_WS_URL=wss://ci.example.com/ws
          docker compose -f infra/docker/docker-compose.prod.yml config --quiet

      # beta-review: coturn 4.18 ABORTS on config it cannot parse (the old
      # IPv6 CIDR denied-peer-ip lines crash-looped TURN on every install
      # and no job ever started it). Boot the pinned image with the config
      # the installer renders and require it to stay up.
      # security-review INFRA-001: render EXACTLY like install.sh (umask
      # 077 -> 0600 file) and start the container the way compose does
      # (user 0:0 + cert-watcher entrypoint). The old check ran the image
      # as its default user against a 0644 file, so it never saw that real
      # installs could not read the config and fell back to an anonymous
      # open relay. The probe sends an unauthenticated Allocate: anything
      # but 401 fails the job.
      - name: coturn starts with the rendered production config and enforces auth
        run: |
          (umask 077 && bash scripts/render-configs.sh ci.example.com "$(printf 'a%.0s' $(seq 1 64))" infra /tmp/lf-render)
          test "$(stat -c %a /tmp/lf-render/turn/turnserver.conf)" = "600"
          image=$(grep -o 'coturn/coturn:[^ ]*' infra/docker/docker-compose.prod.yml | head -1)
          docker run -d --name lf-coturn-check --user 0:0 -p 3478:3478/udp \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add DAC_READ_SEARCH \
            --cap-add KILL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges:true \
            --entrypoint /bin/sh \
            -v /tmp/lf-render/turn/turnserver.conf:/etc/coturn/turnserver.conf:ro \
            -v "$PWD/infra/turn/cert-watcher.sh:/usr/local/bin/cert-watcher.sh:ro" \
            "$image" /usr/local/bin/cert-watcher.sh
          sleep 8
          docker logs lf-coturn-check 2>&1 | tail -40
          if docker logs lf-coturn-check 2>&1 | grep -qiE "Aborting|Wrong address format|Cannot find config file|FATAL"; then
            echo "::error::coturn did not load the rendered turnserver.conf"; exit 1
          fi
          test "$(docker inspect -f '{{.State.Running}}' lf-coturn-check)" = "true"
          # proc-user drop: turnserver must not keep running as root.
          docker top lf-coturn-check -o user,pid,args | tee /tmp/lf-coturn-top
          if grep turnserver /tmp/lf-coturn-top | grep -qE '^(root|0) '; then
            echo "::error::turnserver is still running as root (proc-user drop failed)"; exit 1
          fi
          node scripts/turn-auth-probe.mjs 127.0.0.1 3478
          docker rm -f lf-coturn-check

  # TEST-001: production TLS e2e — the REAL prod stack (nginx + web +
  # ws-gateway + livekit + postgres + redis, rendered configs, boot
  # migrations) behind an nginx TLS edge with a self-signed cert. The
  # dev-stack e2e job above proves the app; this job proves the edge a
  # production user hits: HTTPS termination, the HTTP→HTTPS redirect,
  # and the WSS /ws upgrade into the gateway.
  e2e-prod-tls:
    name: e2e (production TLS edge)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LF_E2E_BASE_URL: https://ci.example.com
      LF_E2E_TLS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Self-signed certificate + rendered configs + .env.prod
        run: |
          DOMAIN=ci.example.com
          # Cert at the exact path the certbot volume serves — nginx's
          # rendered config points here.
          CERT_DIR=infra/certbot/conf/live/$DOMAIN
          mkdir -p "$CERT_DIR"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes \
            -keyout "$CERT_DIR/privkey.pem" \
            -out "$CERT_DIR/fullchain.pem" \
            -subj "/CN=$DOMAIN" -addext "subjectAltName=DNS:$DOMAIN"
          # Rendered (git-ignored) configs from the same templates the
          # installer uses — the stack under test is byte-identical to
          # a deploy. The webhook key names LIVEKIT_API_KEY below (as
          # install.sh does), so LiveKit boots with its webhook enabled.
          LIVEKIT_WEBHOOK_API_KEY=cikey bash scripts/render-configs.sh "$DOMAIN" "$(printf 'a%.0s' $(seq 1 64))" infra infra
          cat > .env.prod <<'EOF'
          LOBBYFORGE_SESSION_SECRET=ci-tls-secret-ci-tls-secret-ci-tls
          LOBBYFORGE_ADMIN_TOKEN=ci-tls-admin-token-0123456789abcdef
          LIVEKIT_API_KEY=cikey
          LIVEKIT_API_SECRET=cisecretcisecretcisecret
          NEXT_PUBLIC_BASE_URL=https://ci.example.com
          # migrate.js reads DATABASE_URL (LF_DB_URL in the compose file
          # is the ws-gateway's var) — point it at the compose-internal
          # postgres exactly like install.sh does for a real deploy.
          DATABASE_URL=postgres://lobbyforge:ci@postgres:5432/lobbyforge
          EOF
          # Interpolation vars for docker compose (build args + services).
          echo "POSTGRES_PASSWORD=ci" >> .env.prod
          echo "REDIS_PASSWORD=ci" >> .env.prod
          echo "TURN_AUTH_SECRET=$(printf 'a%.0s' $(seq 1 64))" >> .env.prod
          echo "LOBBYFORGE_PLUGIN_WORKER_TOKEN=ciworker" >> .env.prod
          echo "LOBBYFORGE_PLUGIN_STORAGE_TOKEN=cistorage" >> .env.prod
          echo "ACME_EMAIL=ci@example.com" >> .env.prod
          echo "LOBBYFORGE_DOMAIN=$DOMAIN" >> .env.prod
          echo "NEXT_PUBLIC_LIVEKIT_URL=wss://$DOMAIN/livekit" >> .env.prod
          echo "NEXT_PUBLIC_WS_URL=wss://$DOMAIN/ws" >> .env.prod

      - name: Start the production stack (TLS edge)
        run: |
          docker compose -f infra/docker/docker-compose.prod.yml \
            -f infra/docker/docker-compose.prod-ci.yml \
            --env-file .env.prod up -d --build --wait nginx livekit

      - name: Show stack status on failure
        if: failure()
        run: |
          docker compose -f infra/docker/docker-compose.prod.yml ps || true
          docker logs lobbyforge-nginx --tail 50 || true
          docker logs lobbyforge-migrate --tail 50 || true
          docker logs lobbyforge-web --tail 100 || true
          docker logs lobbyforge-livekit --tail 50 || true
          docker inspect --format '{{json .State.Health}}' lobbyforge-livekit || true
          # What does :7880 actually answer? (busybox wget shows the
          # status line with -S)
          docker exec lobbyforge-livekit busybox wget -S -O /dev/null http://localhost:19580/ || true

      - name: Install Playwright chromium
        run: pnpm --filter @lobbyforge/web exec playwright install --with-deps chromium

      - name: Point ci.example.com at loopback
        # The browser resolves the domain via --host-resolver-rules, but
        # Playwright's request contexts resolve in the Node process —
        # /etc/hosts covers both.
        run: echo "127.0.0.1 ci.example.com" | sudo tee -a /etc/hosts

      - name: Run prod-TLS e2e
        run: pnpm --filter @lobbyforge/web exec playwright test prod-tls.spec.ts

      - name: Diagnose the edge on e2e failure
        if: failure()
        run: |
          echo "=== containers ==="
          docker ps -a --format '{{.Names}} {{.Status}}' | grep lobbyforge || true
          echo "=== nginx state ==="
          docker inspect lobbyforge-nginx --format 'status={{.State.Status}} restarts={{.RestartCount}} oom={{.State.OOMKilled}}' || true
          echo "=== nginx logs (tail 100) ==="
          docker logs lobbyforge-nginx --tail 100 2>&1 || true
          echo "=== edge probes from the runner ==="
          curl -sv --max-time 10 https://127.0.0.1/api/health -H 'Host: ci.example.com' 2>&1 | tail -20 || true
          curl -sv --max-time 10 http://127.0.0.1/ -H 'Host: ci.example.com' 2>&1 | tail -8 || true

      - name: Teardown
        if: always()
        run: |
          docker compose -f infra/docker/docker-compose.prod.yml \
            -f infra/docker/docker-compose.prod-ci.yml down -v || true

  # DESK-001: the desktop shell's Rust side had no CI — a broken build
  # surfaced only when someone ran tauri dev locally. Compile-gate it on
  # the same Windows runner the verify matrix already uses.
  desktop-rust:
    name: Desktop shell (cargo check)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  # Production dependency audit gate — Dependabot handles updates; this
  # stops a merge that reintroduces a known moderate+ vulnerability in
  # production dependencies (dev-only advisories are out of scope).
  audit:
    name: Dependency audit (prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=moderate

  # DB migration journal integrity — verifies all migration files are
  # tracked in _journal.json in the correct order and snapshots exist.
  migration-check:
    name: DB migration integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # db tests import @lobbyforge/core AND check dist/migrate.js exists —
      # both @lobbyforge/core and @lobbyforge/db must be built first.
      - name: Build dependencies
        run: pnpm --filter @lobbyforge/config build && pnpm --filter @lobbyforge/core build && pnpm --filter @lobbyforge/db build

      - name: Migration journal test
        run: pnpm --filter @lobbyforge/db test

      # 0028 visibility queries against a REAL migrated postgres — proves
      # the SQL (override joins, inheritance, replacement) not just mocks.
      - name: Channel visibility integration (real Postgres)
        run: |
          # Random host port (avoids clashing with anything on 5432); the
          # readiness loop requires TWO consecutive successes because the
          # entrypoint restarts postgres after initdb.
          docker run -d --name lf-pg-test -p 127.0.0.1::5432 -e POSTGRES_PASSWORD=t -e POSTGRES_DB=d postgres:16-alpine
          PORT=$(docker port lf-pg-test 5432/tcp | head -1 | sed 's/.*://')
          echo "pg test port: $PORT"
          READY=0
          for i in $(seq 1 60); do
            if docker exec lf-pg-test pg_isready -U postgres -d d >/dev/null 2>&1; then
              READY=$((READY+1)); [ "$READY" -ge 2 ] && break; sleep 1
            else
              READY=0; sleep 1
            fi
          done
          [ "$READY" -ge 2 ] || { docker logs lf-pg-test; exit 1; }
          cd packages/db
          DATABASE_URL="postgres://postgres:t@127.0.0.1:$PORT/d" node dist/migrate.js
          TEST_DATABASE_URL="postgres://postgres:t@127.0.0.1:$PORT/d" pnpm vitest run src/__tests__/channel-visibility.integration.test.ts
          # 19th-audit: real-Postgres ownership tests (plugin catalog
          # first-submit/race/NULL-publisher + registry concurrent/NULL-owner)
          TEST_DATABASE_URL="postgres://postgres:t@127.0.0.1:$PORT/d" pnpm vitest run src/__tests__/ownership.integration.test.ts
          # beta-review: irreversible setup lock, atomic registration /
          # invite consumption (now self-bootstrapping) and ban → membership
          # revocation against real Postgres.
          TEST_DATABASE_URL="postgres://postgres:t@127.0.0.1:$PORT/d" pnpm vitest run src/__tests__/integration.test.ts src/__tests__/bans.integration.test.ts
          # security-review: sanctions that survive leave/rejoin, the
          # last-gating-role refusal and approval-required joins (AUTHZ-001/
          # 002/004), plus the bots runtime — SQL that mocks cannot prove.
          TEST_DATABASE_URL="postgres://postgres:t@127.0.0.1:$PORT/d" pnpm vitest run src/__tests__/member-sanctions.integration.test.ts src/__tests__/bots.integration.test.ts src/__tests__/user-images.integration.test.ts src/__tests__/bot-api-v2.integration.test.ts
          # 0043 join approval queue: one pending per user, invite uses
          # taken once per user and code, cross-server request ids, and
          # ban-made rejections that leave no cooldown after an unban.
          TEST_DATABASE_URL="postgres://postgres:t@127.0.0.1:$PORT/d" pnpm vitest run src/__tests__/join-requests.integration.test.ts
          # 0045 bot protection: defaults for rows the previous image wrote,
          # partial updates, and the CHECKs that keep a plaintext secret out.
          TEST_DATABASE_URL="postgres://postgres:t@127.0.0.1:$PORT/d" pnpm vitest run src/__tests__/captcha.integration.test.ts
          # 0046 email: the Google backfill, mail settings and their CHECKs,
          # one live challenge per user and purpose, the code attempt cap,
          # and the consumption race (exactly one submission wins).
          TEST_DATABASE_URL="postgres://postgres:t@127.0.0.1:$PORT/d" pnpm vitest run src/__tests__/email.integration.test.ts
          # Activity actions: read → reduce → write serialized per session by
          # a transaction-scoped advisory lock — concurrent writers from two
          # pools all apply, a held lock times out, a throw rolls back.
          TEST_DATABASE_URL="postgres://postgres:t@127.0.0.1:$PORT/d" pnpm vitest run src/__tests__/game-session-lock.integration.test.ts src/__tests__/game-session-host.integration.test.ts src/__tests__/operator-accounts.integration.test.ts
          docker rm -f lf-pg-test

  # LF-023: end-to-end against the REAL compose stack — Postgres, Redis,
  # LiveKit and the production-built web image (docker-compose.dev.yml).
  # Runs only the compose-stack spec; the dev-server UI specs stay local
  # (they assume a seeded dev instance).
  e2e:
    name: e2e (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LF_E2E_BASE_URL: http://localhost:19520
      LF_E2E_SETUP_TOKEN: ci_e2e_setup_token_0123456789abcdef
      LOBBYFORGE_SETUP_TOKEN: ci_e2e_setup_token_0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + start the stack (migrations run, health-checked)
        run: docker compose -f infra/docker/docker-compose.dev.yml up -d --build --wait

      - name: Show stack status on failure
        if: failure()
        run: |
          docker compose -f infra/docker/docker-compose.dev.yml ps || true
          docker logs lobbyforge-web --tail 100 || true
          docker logs lobbyforge-migrate --tail 50 || true

      - name: Install Playwright chromium
        run: pnpm --filter @lobbyforge/web exec playwright install --with-deps chromium

      - name: Run compose-stack e2e
        run: pnpm --filter @lobbyforge/web exec playwright test compose-stack.spec.ts

      # V5-008: REAL two-client voice — distinct users connect, publish
      # (fake-device) microphones and subscribe to each other over the
      # stack's LiveKit. The e2e-ports override gives LiveKit its OWN
      # ICE ports (7890/7892) so client packets reach THIS instance.
      - name: Two-client voice e2e
        run: |
          pnpm --filter @lobbyforge/web exec playwright test voice-two-clients.spec.ts

      # beta-review: the REAL lobby UI (not a synthetic harness) — two
      # users join from the voice channel button and the browsers' own
      # WebRTC stats must show audio flowing; mute, deafen (incl. late
      # joiners), moderator server-mute (cannot be self-undone), mic
      # permission denied → listen-only, push-to-talk, reload/rejoin and
      # realtime chat delivery through the ws-gateway.
      - name: Voice + realtime through the real UI
        run: |
          pnpm --filter @lobbyforge/web exec playwright test voice-ui-audio.spec.ts --workers=1

      # V5-004: destructive backup drill against a disposable postgres —
      # prove backup -> destroy -> restore -> verify on every push.
      - name: Destructive backup drill
        run: |
          pnpm --filter @lobbyforge/config build
          pnpm --filter @lobbyforge/core build
          pnpm --filter @lobbyforge/db build
          bash scripts/backup-drill.sh

      - name: Teardown
        if: always()
        run: docker compose -f infra/docker/docker-compose.dev.yml down -v
