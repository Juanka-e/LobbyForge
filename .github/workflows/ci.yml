name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm MUST be installed before setup-node's cache: pnpm lookup.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build packages first — workspace typecheck depends on built dist/
      # type declarations (e.g. @lobbyforge/plugin-sdk for plugins/quiz).
      - name: Build packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Test
        run: pnpm test

      - name: Build server
        run: pnpm build:server

  # Docker image build — verifies the Dockerfile compiles and the image starts.
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t lobbyforge-web:ci .

  # DB migration journal integrity — verifies all migration files are
  # tracked in _journal.json in the correct order and snapshots exist.
  migration-check:
    name: DB migration integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # db tests import @lobbyforge/core — must be built first.
      - name: Build dependencies
        run: pnpm --filter @lobbyforge/config build && pnpm --filter @lobbyforge/core build

      - name: Migration journal test
        run: pnpm --filter @lobbyforge/db test
