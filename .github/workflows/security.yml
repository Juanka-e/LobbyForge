name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # LF-SEC-015: lockfile-aware dependency advisory scan on the RESOLVED
  # versions — runs on every push AND weekly so a newly-published
  # advisory against an unchanged lockfile still surfaces. The ci.yml
  # `audit` job gates merges with the same severity policy; this one
  # provides the no-code-change coverage.
  dependency-audit:
    name: Dependency audit (scheduled + push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=moderate

  # 9th-audit: RustSec advisory scan for the desktop shell — the Node
  # side has pnpm audit; Cargo.lock is a SEPARATE dependency graph.
  cargo-audit:
    name: Desktop Rust dependency audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit (Cargo.lock)
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

  # 9th-audit: the existing Trivy gate scans the LobbyForge web image;
  # the production stack also ships THIRD-PARTY images (nginx, redis,
  # postgres, livekit, coturn, certbot). Scan the pinned versions the
  # compose file actually deploys.
  third-party-image-scan:
    name: Third-party image vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: 'nginx:1.27-alpine'
          - image: 'redis:7-alpine'
          - image: 'postgres:16-alpine'
          - image: 'livekit/livekit-server:v1.13.6'
          - image: 'coturn/coturn:4.17.2'
          - image: 'certbot/certbot:v2.11.0'
    steps:
      # Same approach as the web-image trivy job: run the official
      # Trivy image directly (the action wrapper proved flaky).
      - name: Trivy scan ${{ matrix.image }}
        run: |
          docker run --rm             aquasec/trivy:0.65.0             image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed             --scanners vuln             ${{ matrix.image }}

  # V5-009: SAST — CodeQL javascript/typescript analysis.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # V5-009: container CVE scan of the production image. CRITICAL fails
  # the build; HIGH is reported (base-image HIGHs are frequent and
  # actionable via redeploys rather than blocking every PR).
  trivy:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t lobbyforge-web:scan .

      # Run the official Trivy image directly against the Docker socket —
      # the trivy-action wrapper's binary-install step proved flaky here.
      - name: Trivy vulnerability scan
        run: |
          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.65.0             image --exit-code 1 --severity CRITICAL --ignore-unfixed             --scanners vuln             lobbyforge-web:scan
