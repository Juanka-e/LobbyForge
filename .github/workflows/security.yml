name: security

on:
  push:
    branches: [main]
    # 20th-audit: release gate — tag pushes must run the security scans so
    # the release workflow can require them completed+success on the tag SHA.
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# security-review §7.1: least privilege — read-only by default; only the
# CodeQL job gets security-events:write (to upload SARIF), set on the job.
# Actions are pinned to full commit SHAs (tag in the trailing comment).
permissions:
  contents: read

jobs:
  # LF-SEC-015: lockfile-aware dependency advisory scan on the RESOLVED
  # versions — runs on every push AND weekly so a newly-published
  # advisory against an unchanged lockfile still surfaces. The ci.yml
  # `audit` job gates merges with the same severity policy; this one
  # provides the no-code-change coverage.
  dependency-audit:
    name: Dependency audit (scheduled + push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=moderate

  # 9th-audit: RustSec advisory scan for the desktop shell — the Node
  # side has pnpm audit; Cargo.lock is a SEPARATE dependency graph.
  cargo-audit:
    name: Desktop Rust dependency audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit (Cargo.lock)
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

  # 9th-audit: the existing Trivy gate scans the LobbyForge web image;
  # the production stack also ships THIRD-PARTY images (nginx, redis,
  # postgres, livekit, coturn, certbot). Scan the pinned versions the
  # compose file actually deploys.
  third-party-image-scan:
    # 12th-audit: STABLE name keyed on matrix.key only — GitHub appends
    # every matrix field to the check name, so the image-tag form never
    # matched the branch-protection contexts (merge blocker, not a
    # bypass). This form matches "Third-party Trivy (nginx)" etc.
    name: Third-party Trivy (${{ matrix.key }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: 'nginx:1.31-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2'
            key: nginx
          - image: 'redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0'
            key: redis
          - image: 'postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685'
            key: postgres
          - image: 'livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3'
            key: livekit
          - image: 'coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3'
            key: coturn
          - image: 'certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20'
            key: certbot
    steps:
      # Same approach as the web-image trivy job: run the official
      # Trivy image directly (the action wrapper proved flaky).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Policy: third-party images gate on CRITICAL only — HIGHs in
      # upstream base layers (e.g. alpine util-linux mount TOCTOUs in
      # nginx) are outside our control, sit in containers that never
      # invoke the affected binaries, and would permanently block CI on
      # upstream rebuild cadence. Our OWN web image keeps the stricter
      # CRITICAL+HIGH gate above. Documented exceptions live in
      # .trivyignore with reasons + revisit dates.
      - name: Trivy scan ${{ matrix.image }}
        run: |
          docker run --rm             -v "$PWD/.trivyignore.d/${{ matrix.key }}:/tmp/.trivyignore:ro"             aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436             image --exit-code 1 --severity CRITICAL --ignore-unfixed             --ignorefile /tmp/.trivyignore             --scanners vuln             ${{ matrix.image }}

  # V5-009: SAST — CodeQL javascript/typescript analysis.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: '/language:javascript-typescript'

  # V5-009: container CVE scan of the production image. CRITICAL+HIGH fail
  # the build; HIGH is reported (base-image HIGHs are frequent and
  # actionable via redeploys rather than blocking every PR).
  trivy:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t lobbyforge-web:scan .

      # Run the official Trivy image directly against the Docker socket —
      # the trivy-action wrapper's binary-install step proved flaky here.
      - name: Trivy vulnerability scan
        run: |
          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             -v "$PWD/.trivyignore.d/web-image:/tmp/.trivyignore:ro"             aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436             image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed             --ignorefile /tmp/.trivyignore             --scanners vuln             lobbyforge-web:scan
