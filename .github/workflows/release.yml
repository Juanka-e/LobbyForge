name: release

on:
  push:
    tags:
      - 'v*'

# 21st-audit: top-level permissions create a "specified → rest are none"
# world. The verify job needs checks:read for the check-runs API, so every
# job gets an EXPLICIT permission block below.
permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  # 20th-audit: a REAL gate. The tag push triggers ci.yml + security.yml
  # (both have `tags: ['v*']`), and scripts/release-gate.mjs waits until
  # every expected check context is completed on the tagged SHA, then
  # requires success. A release cannot ship from a commit with a red or
  # missing check.
  verify:
    name: Pre-release verification
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      # 21st-audit: /commits/{sha}/check-runs requires checks:read — with
      # top-level permissions defined, an unspecified scope is `none`.
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Wait for CI + security checks, then gate on success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-gate.mjs

  # 23rd-audit: staged publish — the image is BUILT and pushed only to a
  # CANDIDATE ref. The exact digest is scanned; only after the scan is
  # green does `promote` attach the public semver tags. A build that
  # fails its scan therefore never exists under a release tag.
  # The pushed DIGEST is exported — it is the immutable artifact the
  # signed manifest pins and `lfctl update apply` deploys.
  docker-publish:
    name: Build + push candidate image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (candidate ref only)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=candidate-

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # Explicit (not runner-default): the beta release policy is
          # linux/amd64 only — see docs/BETA_RELEASE.md. ARM64 support
          # means adding it here + a multi-arch scan strategy.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  # 21st-audit: the EXACT pushed image (by digest, not a mutable tag) is
  # scanned — same CRITICAL+HIGH policy as the security workflow's
  # web-image scan.
  # 22nd-audit: GHCR packages default to PRIVATE on first publish — the
  # scan logs in (packages:read) and PULLS the digest first, so it works
  # regardless of visibility, then Trivy scans the local image via the
  # docker socket (image-src auto → daemon before registry).
  scan:
    name: Trivy scan (exact digest)
    runs-on: ubuntu-latest
    needs: docker-publish
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact digest + Trivy scan
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}@${{ needs.docker-publish.outputs.digest }}"
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"
          echo "Scanning $IMAGE"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.d/web-image:/tmp/.trivyignore:ro" \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile /tmp/.trivyignore \
            --scanners vuln \
            "$IMAGE"

  # 23rd-audit: scan-green promotion — attach the PUBLIC semver tags to
  # the already-scanned digest (metadata-only, no rebuild) and ensure the
  # package is public. Until this job succeeds, no release tag exists and
  # nothing is anonymously pullable under a release tag.
  promote:
    name: Promote scanned digest to release tags
    runs-on: ubuntu-latest
    needs: [docker-publish, scan]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach release tags to the scanned digest
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          DIGEST="${IMAGE}@${{ needs.docker-publish.outputs.digest }}"
          VERSION="${GITHUB_REF_NAME#v}"
          SHORT_SHA="${GITHUB_SHA::7}"
          # 24th-audit: the rolling MAJOR.MINOR tag is a FINAL-release
          # alias — 0.2.0-rc.1 must not also mint "0.2.0-rc". Prereleases
          # (dash separator) get only their exact version + sha tags.
          TAG_ARGS=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$SHORT_SHA")
          if [[ "$VERSION" != *-* ]]; then
            TAG_ARGS+=(--tag "$IMAGE:${VERSION%.*}")
          fi
          echo "Promoting $DIGEST -> ${TAG_ARGS[*]}"
          docker buildx imagetools create "${TAG_ARGS[@]}" "$DIGEST"

      # 22nd-audit: GHCR container packages default to PRIVATE on first
      # publish — self-hosters must be able to `docker compose pull` the
      # digest ANONYMOUSLY or the updater cannot work. Runs AFTER the
      # scan (a rejected image never becomes publicly pullable) and after
      # promotion. Best-effort flip via the API (needs package-admin; may
      # fail on the very first publish); otherwise VERIFY it is public.
      - name: Ensure package is public (self-host pull requirement)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${GITHUB_REPOSITORY##*/}"
          if gh api --method PATCH "/user/packages/container/${PKG,,}" -f visibility=public >/dev/null 2>&1; then
            echo "ghcr.io package ${PKG,,} set to public."
            exit 0
          fi
          echo "PATCH failed (token lacks package-admin or first-publish lag) — verifying current visibility…"
          for i in 1 2 3 4 5; do
            VIS=$(gh api "/user/packages/container/${PKG,,}" --jq '.visibility' 2>/dev/null || true)
            [ "$VIS" = "public" ] && { echo "Package already public."; exit 0; }
            sleep 10
          done
          echo "::error::ghcr.io/${GITHUB_REPOSITORY,,} is '${VIS:-unknown}' — self-host updates pull it anonymously."
          echo "::error::Set the package PUBLIC once in its GitHub settings (Package settings → Danger Zone → Change visibility), then re-run."
          exit 1

  # Build desktop installers. Honest about status (ADR-005: unsigned,
  # experimental): the job is continue-on-error at the JOB level so a
  # broken desktop build is VISIBLE as a failed check but cannot block
  # the server release — and when it does build, the real Tauri
  # bundles (dmg/msi/deb/AppImage) are collected and checksummed.
  desktop:
    name: Desktop bundles (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: verify
    continue-on-error: true
    timeout-minutes: 60
    # 21st-audit: windows-latest defaults to pwsh — every run step here
    # is Bash (find/sha256sum), so force it for the whole job.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages the desktop shell imports must be built first.
      - name: Build workspace packages
        run: pnpm build:packages

      # 21st-audit: desktop versioning must follow the unified release —
      # inject the tag version into tauri.conf.json + package.json so
      # installer filenames and metadata match the release tag.
      - name: Inject release version
        run: |
          node -e '
            const fs = require("fs");
            const version = process.argv[1].replace(/^v/, "");
            const conf = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8"));
            conf.version = version;
            fs.writeFileSync("apps/desktop/src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
            const pkg = JSON.parse(fs.readFileSync("apps/desktop/package.json", "utf8"));
            pkg.version = version;
            fs.writeFileSync("apps/desktop/package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("desktop version ->", version);
          ' "${{ github.ref_name }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target == 'linux' && 'x86_64-unknown-linux-gnu' || matrix.target == 'windows' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      # tsc + tauri build — the committed dist-shell/ is the frontendDist,
      # and tauri build produces the installers under target/release/bundle/.
      - name: Build desktop app (tsc + tauri build)
        run: pnpm --filter @lobbyforge/desktop build

      # 21st-audit: FLAT staging with platform-prefixed unique names — the
      # release job then assembles ONE SHA256SUMS.txt whose entries match
      # the flat GitHub Release asset names users download.
      - name: Collect bundles (flat, platform-prefixed)
        if: always()
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE:-$(pwd)}"
          BUNDLE_DIR="$ROOT/apps/desktop/src-tauri/target/release/bundle"
          mkdir -p "$ROOT/release-artifacts"
          if [ -d "$BUNDLE_DIR" ]; then
            while IFS= read -r -d '' f; do
              cp "$f" "$ROOT/release-artifacts/desktop-${{ matrix.target }}-$(basename "$f")"
            done < <(find "$BUNDLE_DIR" -type f \
              \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
                 -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -print0)
          fi
          cd "$ROOT/release-artifacts"
          COUNT=$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "No Tauri bundles were produced (desktop build experimental — see ADR-005)." | tee DESKTOP-BUNDLES-MISSING.txt
          fi
          ls -la

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: release-artifacts/

  # Create the GitHub Release with all artifacts + SBOM + checksums +
  # the signed release manifest that `lfctl update` consumes.
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, docker-publish, scan, promote, desktop]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts/

      # 21st-audit: ONE flat staging dir — installers already carry
      # desktop-<platform>- prefixes; a single SHA256SUMS.txt whose lines
      # match the exact asset names users download (sha256sum -c works).
      - name: Stage release files + aggregate checksums
        run: |
          set -euo pipefail
          mkdir -p release-staging
          find release-artifacts -type f \
            ! -name 'SHA256SUMS*' ! -name 'DESKTOP-BUNDLES-MISSING.txt' \
            -exec cp '{}' release-staging/ ';'
          echo "Staged files:"
          ls -la release-staging/

      - name: Compute release coordinates
        run: |
          # metadata-action tags are lowercase repo + semver WITHOUT the v
          # prefix — the release body must quote the tag it actually pushed.
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=ghcr.io/${GITHUB_REPOSITORY,,}@${{ needs.docker-publish.outputs.digest }}" >> "$GITHUB_ENV"
          echo "GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Prefer the section for THIS version; fall back to the newest
          # section (Unreleased) when the changelog hasn't been retitled yet.
          CHANGELOG=$(awk -v ver="v$VERSION" -v bare="$VERSION" '
            /^## \[/ {
              if (started) exit
              if (index($0, ver) || index($0, "[" bare "]")) { started=1 }
              else if (!taken) { taken=1; started=1 }
            }
            started { print }
          ' docs/CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See [docs/CHANGELOG.md](docs/CHANGELOG.md) for details."
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The manifest `lfctl update check --manifest <release-asset-url>`
      # consumes. 21st-audit: signing is FAIL-CLOSED — the generator
      # refuses to write an unsigned manifest (the script errors unless
      # --allow-unsigned is passed explicitly). The manifest pins the
      # immutable image digest + git SHA: `lfctl update apply` deploys
      # exactly these verified bytes.
      - name: Generate signed release manifest (lfctl update)
        env:
          LF_RELEASE_SIGNING_KEY: ${{ secrets.LF_RELEASE_SIGNING_KEY }}
        run: |
          node scripts/release-manifest.mjs \
            --version "$VERSION" \
            --changelog docs/CHANGELOG.md \
            --git-sha "$GIT_SHA" \
            --image-digest "$IMAGE_DIGEST" \
            --out release-staging/release-manifest.json
          cat release-staging/release-manifest.json

      - name: Generate aggregate checksums
        run: |
          cd release-staging
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: |
            ## LobbyForge ${{ github.ref_name }}

            ${{ steps.changelog.outputs.changelog }}

            ### Artifacts
            - Docker image: `${{ env.IMAGE_REF }}` — verified immutable digest: `${{ env.IMAGE_DIGEST }}`
            - Desktop installers with SHA256 checksums attached (unsigned — ADR-005)
            - SBOM generated via build provenance attestations
            - `release-manifest.json` — signed; pins version + git SHA + image digest; consumed by `lfctl update check`

            ### Install (self-host)
            ```bash
            # The installer needs the repo files (compose stack, nginx/livekit
            # templates, lfctl) — clone the tagged tree, don't curl-pipe it.
            git clone --branch ${{ github.ref_name }} --depth 1 \
              https://github.com/${{ github.repository }}.git lobbyforge
            cd lobbyforge
            bash install.sh
            ```

            ### Update (existing install)
            ```bash
            node scripts/lfctl.mjs update check \
              --manifest https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/release-manifest.json
            ```

            ### Verify artifacts
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          files: |
            release-staging/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
