name: desktop-release

# Builds the Tauri 2 native shell installers (Windows MSI/NSIS, macOS DMG/app,
# Linux deb/AppImage) and publishes them to the GitHub Release when a version
# tag (desktop-v*) is pushed.
#
# The shell is an official client with a connect-to-server model: it asks the
# user for their instance URL on first launch and works against any self-hosted
# LobbyForge instance. There is no per-instance branding step — one installer
# serves every instance.
#
# Trigger manually (workflow_dispatch) for a test build, or push a tag like
# `desktop-v0.1.0` to publish a release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Linux needs webkit2gtk + file-switcher libs for the webview.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TS contracts (the shell re-exports them)
        run: pnpm --filter @lobbyforge/desktop build:ts

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # tagName is read from the pushed tag; on workflow_dispatch there is
          # no tag, so the action uploads artifacts to the run instead.
          tagName: ${{ github.ref_name }}
          releaseName: 'LobbyForge Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## LobbyForge Desktop

            The official native client for LobbyForge — a voice-first, self-hostable
            community platform with live in-room activities.

            **First launch asks for your instance URL** (e.g. `https://my.lobbyforge.dev`).
            It works against any self-hosted LobbyForge instance; there is no central
            account server.
          releaseDraft: true
          prerelease: false
