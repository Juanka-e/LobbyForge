version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      eslint:
        patterns: ["eslint*", "@typescript-eslint/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      next:
        patterns: ["next", "react", "react-dom", "@types/react*"]
      # jest-dom and react peer on @testing-library/dom: move them together.
      testing-library:
        patterns: ["@testing-library/*"]
    ignore:
      # zod 4 is a breaking rewrite, not a bump. On 4.x our API routes would
      # return differently worded `issues` messages to clients and bots,
      # `.uuid()` / `.datetime()` reject input 3.x accepted, `z.record(enum)`
      # makes every key required, and a few types stop compiling. Most of
      # that is not covered by tests. It needs its own PR (zod 3.25 ships
      # `zod/v4`, so it can move one package at a time). Minor and patch 3.x
      # updates still arrive. Revisit when that migration is scheduled, and
      # delete this rule in the PR that does it.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # tailwind-merge 3 supports only Tailwind CSS 4 and we're on 3.4.
      # Against Tailwind 3 class names it merges wrongly, e.g. `cn("bg-red-500
      # bg-opacity-50")` loses the background colour. Move it in the same PR as
      # the Tailwind 4 migration, and delete this rule there.
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      # @types/node has to match the Node we run: 22 LTS in the Dockerfile,
      # in CI's setup-node and in `engines`. Newer types would let code
      # type-check against APIs Node 22 doesn't have. 22.x updates still
      # arrive. When the runtime moves to a new LTS, raise this bound in that
      # same PR.
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Workflows pin actions to full commit SHAs (tag in a trailing comment);
  # this ecosystem bumps the SHA and the comment together. Weekly, so a
  # security fix in a pinned action is not stuck for a month.
  # dtolnay/rust-toolchain has no version tags — bump that pin by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # init and analyze must run the same version: a PR that bumps only
      # one of them fails CodeQL ("configuration file for version X, but
      # running version Y").
      codeql:
        patterns: ["github/codeql-action*"]
      # upload and download are released as a pair (upload v7 with download v8).
      artifacts:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
      # setup-buildx, login, metadata and build-push work together in the
      # image publish job; test and merge their majors as one change.
      docker:
        patterns: ["docker/*"]
  - package-ecosystem: "docker-compose"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
