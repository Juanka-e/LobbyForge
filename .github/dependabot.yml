version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      eslint:
        patterns: ["eslint*", "@typescript-eslint/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      next:
        patterns: ["next", "react", "react-dom", "@types/react*"]
    ignore:
      # zod 4 is a breaking rewrite, not a bump. On 4.x our API routes would
      # return differently worded `issues` messages to clients and bots,
      # `.uuid()` / `.datetime()` reject input 3.x accepted, `z.record(enum)`
      # makes every key required, and a few types stop compiling. Most of
      # that is not covered by tests. It needs its own PR (zod 3.25 ships
      # `zod/v4`, so it can move one package at a time). Minor and patch 3.x
      # updates still arrive. Revisit when that migration is scheduled, and
      # delete this rule in the PR that does it.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Workflows pin actions to full commit SHAs (tag in a trailing comment);
  # this ecosystem bumps the SHA and the comment together. Weekly, so a
  # security fix in a pinned action is not stuck for a month.
  # dtolnay/rust-toolchain has no version tags — bump that pin by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "docker-compose"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
