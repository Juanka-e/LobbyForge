name: lobbyforge-dev

# Local development stack for LobbyForge.
#
# Builds the app image and runs ALL of it on this machine: Postgres, Redis,
# LiveKit, the one-shot migrations, the web app (production build,
# NODE_ENV=production) and the realtime gateway. It is intentionally
# separate from the production deployment (docker-compose.prod.yml +
# install.sh), which adds nginx, certbot, TLS and generated secrets.
#
# security-review INFRA-V-02 — this stack is for THIS machine only:
#   - every published port binds 127.0.0.1, so nothing is reachable from the
#     LAN (or the internet, on a cloud VM). Do not change that to share it;
#     use the production stack for anything other people reach.
#   - its secrets are public (the defaults below, .env.example). web and
#     ws-gateway accept a published placeholder session secret only because
#     this file sets LOBBYFORGE_DEV_STACK=true; any other deployment that
#     uses one refuses to start.
#
# Usage:
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
#   docker compose -f infra/docker/docker-compose.dev.yml down
#
# Required environment variables (copy .env.example to .env):
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   REDIS_PASSWORD
#   LIVEKIT_API_KEY, LIVEKIT_API_SECRET
#
# Note: paths and volume mounts use the standard compose syntax. On Windows
# the host paths in the `volumes:` section are translated by Docker Desktop's
# WSL2 backend; no escaping needed.

services:
  postgres:
    image: postgres:16-alpine
    container_name: lobbyforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lobbyforge}
      POSTGRES_USER: ${POSTGRES_USER:-lobbyforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lobbyforge_dev}
    ports:
      # Host ports live in a quiet range (see docs/MONOREPO.md).
      - "127.0.0.1:19532:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lobbyforge} -d ${POSTGRES_DB:-lobbyforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # The same pinned image as production, so dev and CI e2e run the Redis
    # we ship. Redis 8 upgrades a Redis 7 volume in place; Redis 7 cannot
    # read it back afterwards (RDB format), so there is no downgrade.
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: lobbyforge-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-lobbyforge_dev}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:19579:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lobbyforge_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    # beta-review: the same pinned server as production (was :latest, so the
    # CI voice E2E never exercised the version we actually ship).
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    container_name: lobbyforge-livekit
    restart: unless-stopped
    # Browser runs on the host in local development. Advertising the Docker
    # bridge/public NAT address makes same-machine ICE fail; advertise the
    # host loopback ports mapped below instead.
    # LiveKit must LISTEN on the ports it advertises to clients, so it moves
    # inside the container too (unlike postgres/redis/web).
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1", "--port", "19580", "--udp-port", "19582"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret_please_change}"
      # security-review AUTHZ-006 follow-up: LiveKit posts its room events
      # to the web app, which removes a participant who publishes a track
      # whose kind does not match its source (audio labelled camera, …).
      # LIVEKIT_CONFIG is a YAML config body (no config file in dev); the
      # CLI flags above still apply on top of it. api_key must name a key
      # from LIVEKIT_KEYS. `web` is the compose service name (the e2e
      # override keeps it).
      LIVEKIT_CONFIG: |
        webhook:
          api_key: "${LIVEKIT_API_KEY:-devkey}"
          urls:
            - http://web:3000/api/livekit/webhook
    ports:
      # Loopback only, media included: LiveKit advertises 127.0.0.1
      # (--node-ip above), so voice only ever worked from this machine
      # — binding the UDP port to 127.0.0.1 keeps dev voice working and
      # stops the LAN reaching the SFU. Voice from another device needs
      # the production stack (docs/VOICE_TURN.md).
      - "127.0.0.1:19580:19580"     # HTTP signaling
      - "127.0.0.1:19582:19582/udp" # RTC media (ICE/TCP is not published locally)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:19580/"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      # No NEXT_PUBLIC_* build args: the browser endpoints are resolved at
      # REQUEST time (token response + a server-rendered meta), so ONE image
      # serves this stack, the parallel e2e stack and a real deployment.
    image: lobbyforge-app:dev
    restart: "no"
    working_dir: /app/packages/db
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lobbyforge}:${POSTGRES_PASSWORD:-lobbyforge_dev}@postgres:5432/${POSTGRES_DB:-lobbyforge}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: lobbyforge-app:dev
    container_name: lobbyforge-web
    restart: unless-stopped
    # Direct next bin (the runtime image ships no pnpm).
    working_dir: /app/apps/web
    command: ["node", "node_modules/next/dist/bin/next", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lobbyforge}:${POSTGRES_PASSWORD:-lobbyforge_dev}@postgres:5432/${POSTGRES_DB:-lobbyforge}
      REDIS_URL: redis://:${REDIS_PASSWORD:-lobbyforge_dev}@redis:6379
      LOBBYFORGE_SESSION_SECRET: ${LOBBYFORGE_SESSION_SECRET:-dev_session_secret_change_before_public_use_1234}
      # INFRA-V-02: the only place a published placeholder session secret is
      # accepted (the default above, .env.example). Never set it elsewhere.
      LOBBYFORGE_DEV_STACK: "true"
      LOBBYFORGE_SETUP_TOKEN: ${LOBBYFORGE_SETUP_TOKEN:-}
      LOBBYFORGE_DEPLOYMENT_MODE: selfhost
      # Fallback language; the default saved at /setup or in Admin wins (docs/TRANSLATING.md).
      LOBBYFORGE_DEFAULT_LOCALE: ${LOBBYFORGE_DEFAULT_LOCALE:-}
      # The CSRF origin guard compares the browser's Origin against the
      # app's own origin. The container listens on 3000 internally, so a
      # published host port MUST be declared here (a real deploy uses
      # NEXT_PUBLIC_BASE_URL from install.sh).
      LOBBYFORGE_APP_ORIGIN: ${LOBBYFORGE_APP_ORIGIN:-http://localhost:19520}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret_please_change}
      # beta-review: server-side LiveKit API (moderator mute, room caps,
      # voice eviction). Without it every RoomServiceClient call failed.
      LIVEKIT_URL: http://livekit:19580
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-http://localhost:19580}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:19521}
    ports:
      - "127.0.0.1:19520:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ws-gateway:
    image: lobbyforge-app:dev
    container_name: lobbyforge-ws-gateway
    restart: unless-stopped
    # beta-review: the image's final WORKDIR is /app/apps/web, so the
    # relative command crash-looped (MODULE_NOT_FOUND) without this.
    working_dir: /app
    command: ["node", "apps/ws-gateway/dist/index.js"]
    environment:
      NODE_ENV: production
      # The gateway reads LF_DB_URL (not DATABASE_URL); without it every
      # subscription was rejected with `unknown_topic`.
      LF_DB_URL: postgresql://${POSTGRES_USER:-lobbyforge}:${POSTGRES_PASSWORD:-lobbyforge_dev}@postgres:5432/${POSTGRES_DB:-lobbyforge}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lobbyforge}:${POSTGRES_PASSWORD:-lobbyforge_dev}@postgres:5432/${POSTGRES_DB:-lobbyforge}
      REDIS_URL: redis://:${REDIS_PASSWORD:-lobbyforge_dev}@redis:6379
      LOBBYFORGE_SESSION_SECRET: ${LOBBYFORGE_SESSION_SECRET:-dev_session_secret_change_before_public_use_1234}
      LOBBYFORGE_DEV_STACK: "true"
      # Inside the container; the published port below is loopback-only.
      WS_HOST: 0.0.0.0
      WS_PORT: 3001
      LOBBYFORGE_APP_ORIGIN: ${LOBBYFORGE_APP_ORIGIN:-http://localhost:19520}
    ports:
      - "127.0.0.1:19521:3001"
    # A healthcheck makes `up --wait` (CI) fail on a crash-looping gateway
    # instead of passing on a momentary "running" snapshot.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Optional: local SMTP catcher for testing email flows. UI at http://localhost:19526.
  mailpit:
    # Same pin as docker-compose.e2e-mail.yml (keep the two in step).
    image: axllent/mailpit:v1.31@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    container_name: lobbyforge-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:19525:1025"  # SMTP
      - "127.0.0.1:19526:8025"  # Web UI
    profiles: ["full"]

  # Optional: local S3-compatible object store. UI at http://localhost:19591.
  minio:
    image: minio/minio:latest
    container_name: lobbyforge-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lobbyforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lobbyforge_dev}
    ports:
      - "127.0.0.1:19590:9000"
      - "127.0.0.1:19591:9001"
    volumes:
      - minio-data:/data
    profiles: ["full"]

  # Optional: TURN server for NAT traversal. Only needed for voice testing
  # from networks that block UDP. See projectdetails/08_LIVEKIT_MEDIA.md.
  # Host networking publishes nothing through Docker, so the listener itself
  # is pinned to loopback (INFRA-V-02) — with a public static secret it
  # would otherwise be a relay for the whole LAN.
  coturn:
    image: coturn/coturn:latest
    container_name: lobbyforge-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--listening-ip=127.0.0.1"
      - "--log-file=stdout"
      - "--realm=lobbyforge.local"
      - "--static-auth-secret=${COTURN_STATIC_AUTH_SECRET:-turn_dev_secret}"
    profiles: ["full"]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  default:
    name: lobbyforge-dev
