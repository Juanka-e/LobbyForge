name: lobbyforge-dev

# Local development stack for LobbyForge.
#
# This is the stack the application code in apps/web connects to on a developer
# machine. It is intentionally separate from the production deployment
# (see projectdetails/04_DEPLOYMENT_SINGLE_VPS_NGINX.md) which uses the
# same images but adds Nginx, certbot, and a public hostname.
#
# Usage:
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
#   docker compose -f infra/docker/docker-compose.dev.yml down
#
# Required environment variables (copy .env.example to .env):
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   REDIS_PASSWORD
#   LIVEKIT_API_KEY, LIVEKIT_API_SECRET
#
# Note: paths and volume mounts use the standard compose syntax. On Windows
# the host paths in the `volumes:` section are translated by Docker Desktop's
# WSL2 backend; no escaping needed.

services:
  postgres:
    image: postgres:16-alpine
    container_name: lobbyforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lobbyforge}
      POSTGRES_USER: ${POSTGRES_USER:-lobbyforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lobbyforge_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lobbyforge} -d ${POSTGRES_DB:-lobbyforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lobbyforge-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-lobbyforge_dev}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lobbyforge_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    container_name: lobbyforge-livekit
    restart: unless-stopped
    # Browser runs on the host in local development. Advertising the Docker
    # bridge/public NAT address makes same-machine ICE fail; advertise the
    # host loopback ports mapped below instead.
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret_please_change}"
    ports:
      - "7880:7880"   # HTTP signaling
      - "7881:7881"   # ICE/TLS
      - "7882:7882/udp" # RTC media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: local SMTP catcher for testing email flows. UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: lobbyforge-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    profiles: ["full"]

  # Optional: local S3-compatible object store. UI at http://localhost:9001.
  minio:
    image: minio/minio:latest
    container_name: lobbyforge-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lobbyforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lobbyforge_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    profiles: ["full"]

  # Optional: TURN server for NAT traversal. Only needed for voice testing
  # from networks that block UDP. See projectdetails/08_LIVEKIT_MEDIA.md.
  coturn:
    image: coturn/coturn:latest
    container_name: lobbyforge-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--realm=lobbyforge.local"
      - "--static-auth-secret=${COTURN_STATIC_AUTH_SECRET:-turn_dev_secret}"
    profiles: ["full"]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  default:
    name: lobbyforge-dev
