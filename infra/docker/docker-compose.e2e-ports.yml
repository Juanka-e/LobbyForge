# LF-023: isolated port/CONTAINER-NAME mapping for running the E2E stack
# NEXT TO a running dev stack on the same machine. Combine with the dev
# compose:
#
#   export LOBBYFORGE_SETUP_TOKEN=e2e_setup_token_default_0123456789ab
#   # Browser endpoints come from THIS stack's runtime env (below) — the
#   # image needs no build args.
#   docker compose -p lobbyforge-e2e \
#     -f infra/docker/docker-compose.dev.yml \
#     -f infra/docker/docker-compose.e2e-ports.yml \
#     up -d --build --wait
#   LF_E2E_BASE_URL=http://localhost:19620 \
#     pnpm --filter @lobbyforge/web exec playwright test compose-stack.spec.ts
#   docker compose -p lobbyforge-e2e \
#     -f infra/docker/docker-compose.dev.yml \
#     -f infra/docker/docker-compose.e2e-ports.yml down -v
#
# Published host ports, container names AND the network name all change
# (the dev compose pins container_name, so a parallel project must
# rename them); container-internal service DNS names are untouched. The
# `-p lobbyforge-e2e` project name gives the stack its own fresh
# volumes — first-run setup runs, exactly like CI.
services:
  postgres:
    container_name: lobbyforge-e2e-postgres
    ports: !override
      - "19632:5432"
  redis:
    container_name: lobbyforge-e2e-redis
    ports: !override
      - "19679:6379"
  livekit:
    container_name: lobbyforge-e2e-livekit
    # ICE correctness: LiveKit must ADVERTISE ports that actually reach
    # THIS container. The dev stack owns host 19580/19582; if this stack
    # advertised the defaults, client ICE packets to 127.0.0.1:7882 would
    # land on the WRONG (dev) LiveKit and the peer connection would die.
    # So run this instance natively on 19690/19692 (identity mapping).
    command: !override
      [
        "--dev",
        "--bind", "0.0.0.0",
        "--node-ip", "127.0.0.1",
        "--port", "19690",
        "--udp-port", "19692",
      ]
    # Healthcheck follows the custom HTTP port (base checks 19580).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:19690/"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: !override
      - "19690:19690"
      - "19692:19692/udp"
  web:
    container_name: lobbyforge-e2e-web
    # The origin guard derives allowed origins from the INTERNAL request
    # URL (container port 3000) — an external port-mapped URL (19620)
    # must be whitelisted explicitly.
    environment:
      LOBBYFORGE_APP_ORIGIN: http://localhost:19620
      # Server-side LiveKit API: this stack's LiveKit listens on 19690.
      LIVEKIT_URL: http://livekit:19690
      # Browser-facing endpoints for THIS stack (resolved per request).
      NEXT_PUBLIC_LIVEKIT_URL: ws://localhost:19690
      NEXT_PUBLIC_WS_URL: ws://localhost:19621
    ports: !override
      - "19620:3000"
  ws-gateway:
    container_name: lobbyforge-e2e-ws-gateway
    environment:
      # The gateway's Origin allow-list must accept the e2e web origin.
      LOBBYFORGE_APP_ORIGIN: http://localhost:19620
    ports: !override
      - "19621:3001"

networks:
  default:
    name: lobbyforge-e2e
