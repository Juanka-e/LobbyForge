name: lobbyforge-prod

# Production Docker Compose for LobbyForge — single VPS deployment.
#
# Usage:
#   1. Copy .env.prod.example to .env.prod and edit values.
#   2. docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d
#
# Requirements:
#   - A domain name pointing at this server (for HTTPS / WebRTC).
#   - Ports 80/443 (HTTP/HTTPS), 7880/7881 (LiveKit signaling), 50000-60000/udp (ICE).
#
# See docs/DEPLOYMENT.md or projectdetails/04_DEPLOYMENT_SINGLE_VPS_NGINX.md
# for the full deployment guide.

services:
  # ── Edge: Nginx reverse proxy + TLS termination ──────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lobbyforge-nginx
    restart: unless-stopped
    # V4-004: nginx loads certificates ONCE at startup. The certbot
    # sidecar renews on disk every 12h — without a reload the proxy keeps
    # serving the OLD certificate until the next restart (an outage
    # waiting ~60-90 days out). A tiny in-container watcher polls the
    # certificate fingerprint and reloads (config-tested) when it
    # changes; reloads are graceful (no dropped connections).
    # shellcheck disable=SC2016
    command:
      - /bin/sh
      - -c
      - |
        md5sum /etc/letsencrypt/live/*/fullchain.pem > /tmp/.certsum 2>/dev/null || true
        while :; do
          sleep 60
          md5sum /etc/letsencrypt/live/*/fullchain.pem > /tmp/.certsum.new 2>/dev/null || true
          if ! cmp -s /tmp/.certsum.new /tmp/.certsum; then
            if nginx -t; then
              nginx -s reload && cp /tmp/.certsum.new /tmp/.certsum
              echo "[cert-watcher] certificate changed — nginx reloaded"
            else
              echo "[cert-watcher] nginx -t FAILED on new certificate — keeping old config"
            fi
          fi
        done &
        exec nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../certbot/www:/var/www/certbot:ro
      - ../certbot/conf:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge

  # ── Certbot: Let's Encrypt certificate automation ────────────────
  certbot:
    image: certbot/certbot:v2.11.0  # LF-010-R: pinned (was :latest)
    container_name: lobbyforge-certbot
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done;"
    volumes:
      - ../certbot/www:/var/www/certbot
      - ../certbot/conf:/etc/letsencrypt
    networks:
      - edge

  # ── App: Next.js web server ──────────────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        # These are baked into the Next.js client bundle at build time.
        # They MUST match the public URLs the browser will use.
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:?required}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?required}
    image: lobbyforge-web:latest
    container_name: lobbyforge-web
    restart: unless-stopped
    env_file:
      - ../../.env.prod
    environment:
      # The web app's Redis client reads REDIS_URL — point it at the
      # compose-internal Redis (not localhost) in the container network.
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DATABASE_URL=postgres://${POSTGRES_USER:-lobbyforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lobbyforge}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - internal

  # ── Realtime: WebSocket gateway ──────────────────────────────────
  ws-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: lobbyforge-web:latest
    container_name: lobbyforge-ws-gateway
    restart: unless-stopped
    working_dir: /app
    command: ["node", "apps/ws-gateway/dist/index.js"]
    env_file:
      - ../../.env.prod
    environment:
      - WS_HOST=0.0.0.0
      - WS_PORT=3001
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - LF_DB_URL=postgres://${POSTGRES_USER:-lobbyforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lobbyforge}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - edge
      - internal

  # ── DB migrations: one-shot at boot ──────────────────────────────
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: lobbyforge-web:latest
    container_name: lobbyforge-migrate
    restart: "no"
    working_dir: /app
    command: ["node", "packages/db/dist/migrate.js"]
    env_file:
      - ../../.env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ── Database: PostgreSQL 16 ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lobbyforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lobbyforge}
      POSTGRES_USER: ${POSTGRES_USER:-lobbyforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lobbyforge} -d ${POSTGRES_DB:-lobbyforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port — only accessible within the Docker network.
    networks:
      - internal

  # ── Cache: Redis 7 ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lobbyforge-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Voice: LiveKit SFU ───────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:1.8.3  # LF-010-R: pinned (was :latest)
    container_name: lobbyforge-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit/livekit.yaml", "--bind", "0.0.0.0"]
    volumes:
      - ../livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7880:7880"     # HTTP signaling (proxied by nginx in prod)
      - "7881:7881"     # ICE/TLS
      - "50000-60000:50000-60000/udp"  # RTC media range
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}:${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - internal

  # ── Voice fallback: coturn TURN relay (LF-019) ────────────────────
  # For clients behind symmetric NATs or UDP-blocking corporate
  # networks: LiveKit advertises this server via rtc.turn_servers in
  # livekit.yaml, and WebRTC clients fall back to it only when
  # direct/STUN paths fail. Host networking is deliberate — mapping a
  # 41-port UDP relay range is error-prone and breaks the external-ip
  # negotiation. Open on the firewall: 3478+5349 (tcp/udp) and
  # 49160-49200/udp.
  turn:
    image: coturn/coturn:4.6.2  # LF-019: pinned
    container_name: lobbyforge-turn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../turn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ../certbot/conf:/etc/letsencrypt:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    # Listener liveness on 3478 (a full TURN allocation smoke test needs
    # the credential and real network egress — see docs/VOICE_TURN.md).
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3478'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  redis-data:

networks:
  edge:
    name: lobbyforge-edge
  internal:
    name: lobbyforge-internal
    internal: true  # No external access — DB/Redis are isolated.
