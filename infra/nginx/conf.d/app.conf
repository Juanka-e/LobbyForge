# LobbyForge web app — HTTPS reverse proxy with WebSocket support.
#
# Replace LOBBYFORGE_DOMAIN with your domain (e.g. lobby.example.com).
# The cert files are provisioned by certbot (see install.sh).

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name LOBBYFORGE_DOMAIN;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS app server
server {
    listen 443 ssl;
    http2 on;
    server_name LOBBYFORGE_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/LOBBYFORGE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/LOBBYFORGE_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers (complement the app's own headers)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket upgrade for the ws-gateway (NEXT_PUBLIC_WS_URL)
    location /ws {
        proxy_pass http://ws-gateway:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;  # 24h — long-lived WS connections
    }

    # Next.js app
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Client max body size for uploads (avatar, banner)
    client_max_body_size 10m;
}
